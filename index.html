<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- CSS only -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="css/style.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="img/logo.png" />
    <title>YTDL</title>
</head>

<body>
    <header class=" nav-bar">
        <a href="index.html"> <img src="img/logo.png" alt="" class="nav navbar nav-bar img-fluid">
        </a>
    </header>
    <section id="section">
        <h1>YouTube Downloader</h1>
        <p>The best free and fast YouTube downloader!</p>
        <br>
        <div class="link-container">
            <label for="video-link">Video Link:</label>
            <input type="text" class="link" id="video-link" name="link" placeholder="Enter Video Link" required />
        </div>
        <div class="format-container">
            <label for="video-format">Format:</label>
            <select class="format" id="video-format" name="format" required>
                <option selected disabled>Select Video Format</option>
                <option value="mp3">Mp3</option>
                <option value="mp4a">144</option>
                <option value="360">360</option>
                <option value="480">480</option>
                <option value="720">720</option>
                <option value="1080">1080</option>
                <option value="4k">4k</option>
                <option value="8k">8k</option>
            </select>

        </div>
        <div class="button-container">
            <button class="btnn" type="submit">Start</button>

        </div>
        <div class="button-reload"><button class="btnnn bg-warning" type="submit">restart</button></div>

        <!-- Remove the container if you want to extend the Footer to full width. -->
    </section>

   <!-- End of .container -->
    <!-- https://www.youtube.com/results?search_query=verfifier+si+un+texte+contien+un+mot+avec+js -->
    <script>



        $(".btnn").click(function () {
            var link = $(".link").val();
            var format = $(".format").children("option:selected").val();
            verifurl = link.indexOf("https://www.youtube.com");
            console.log(verifurl);
            var src = "" + link + "=" + format + "";
            if (link != "" && format != "Select Video Format" && verifurl != -1 ) {

                download(link, format);
            }
            else {
                alert("check your url");
                if (alert) {
                    location.reload();
                }
            }
        });


        function download(link, format) {
            $('.button-container').html('<iframe style="height:50px; border:none; overflow::hidden;" src="https://loader.to/api/button/?url=' + link + '&f=' + format + '"></iframe>');

        }
        $(".btnnn").click(function () {
            location.reload();
        });


    </script>


</body>

</html>
